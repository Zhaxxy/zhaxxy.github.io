<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LittleBigPlanet Plan Browser (frontend entirely by chatgpt)</title>


<style>
    :root {
        color-scheme: dark;

        --bg: #111318;
        --panel: #191c23;
        --panel-2: #20242d;
        --border: #343945;
        --text: #f1f3f7;
        --muted: #9da4b2;
        --accent: #6ea8fe;
        --accent-hover: #8ab8ff;
        --danger: #ff6b6b;
        --selected: #29364e;
        --input: #101218;
    }

    * {
        box-sizing: border-box;
    }

	html,
	body {
		width: 100%;
		min-height: 100%;
		margin: 0;
		padding: 0;
	}



	body {
		font-family:
			system-ui,
			-apple-system,
			BlinkMacSystemFont,
			"Segoe UI",
			sans-serif;
		background: var(--bg);
		color: var(--text);
	}

	.group-filter-group {
		position: relative;
	}

	.searchable-select {
		position: relative;
		min-width: 240px;
	}

	#groupFilterSearch {
		width: 100%;
		height: 38px;
		padding: 0 11px;
	}

	.searchable-dropdown {
		position: absolute;
		left: 0;
		right: 0;
		top: calc(100% + 4px);
		z-index: 50;

		max-height: 320px;
		overflow-y: auto;

		border: 1px solid var(--border);
		border-radius: 6px;
		background: var(--panel);
		box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);

		display: none;
	}

	.searchable-dropdown.open {
		display: block;
	}

	.searchable-option {
		display: block;
		width: 100%;
		padding: 9px 11px;

		border: 0;
		border-radius: 0;

		background: transparent;
		color: var(--text);

		text-align: left;
		cursor: pointer;
	}

	.searchable-option:hover,
	.searchable-option.selected {
		background: var(--selected);
	}

	.searchable-option.all-option {
		border-bottom: 1px solid var(--border);
		color: var(--muted);
	}

	.searchable-no-results {
		padding: 12px;
		color: var(--muted);
		font-size: 13px;
	}

	@media (max-width: 800px) {
		.searchable-select {
			width: 100%;
			min-width: 0;
		}
	}

    button,
    input,
    select {
        font: inherit;
    }

    button,
    select,
    input {
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--text);
        border-radius: 6px;
    }

    button {
        cursor: pointer;
    }

    button:hover {
        border-color: #505766;
    }

	.app {
		display: flex;
		flex-direction: column;
		min-height: 100vh;
	}

	header {
		flex: 0 0 auto;
		padding: 18px 24px;
		border-bottom: 1px solid var(--border);
		background: var(--panel);
	}

	.header-row {
		display: flex;
		align-items: flex-start;
		justify-content: space-between;
		gap: 16px;
	}

	.header-info {
		min-width: 0;
	}

    header h1 {
        margin: 0 0 5px;
        font-size: 22px;
    }

    header .status {
        color: var(--muted);
        font-size: 13px;
    }

	/* ============================
	   Cart button in header
	   ============================ */

	.cart-button {
		position: relative;
		flex: 0 0 auto;
		display: inline-flex;
		align-items: center;
		justify-content: center;

		width: 46px;
		height: 46px;
		padding: 0;

		background: var(--input);
		border: 1px solid var(--border);
		border-radius: 8px;

		color: var(--text);
		cursor: pointer;
	}

	.cart-button:hover {
		background: var(--panel-2);
		border-color: #505766;
	}

	.cart-button svg {
		width: 22px;
		height: 22px;
	}

	.cart-count {
		position: absolute;
		top: -7px;
		right: -7px;

		min-width: 20px;
		height: 20px;
		padding: 0 5px;

		display: flex;
		align-items: center;
		justify-content: center;

		border-radius: 10px;
		background: var(--accent);
		color: #0b1220;

		font-size: 11px;
		font-weight: 700;
		line-height: 1;

		pointer-events: none;
	}

	.cart-count.hidden {
		display: none;
	}

	.toolbar {
		flex: 0 0 auto;
		display: flex;
		flex-wrap: wrap;
		gap: 10px;
		padding: 14px 24px;
		border-bottom: 1px solid var(--border);
		background: var(--panel);
	}

    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .toolbar label {
        color: var(--muted);
        font-size: 13px;
    }

    select,
    input[type="search"] {
        height: 38px;
        padding: 0 11px;
    }

    select {
        min-width: 180px;
    }

    #search {
        width: min(500px, 55vw);
    }

    .checkbox {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--input);
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
    }

    .checkbox input {
        accent-color: var(--accent);
    }


	main {
		display: grid;
		grid-template-columns: minmax(300px, 460px) 1fr;
		align-items: start;
	}



	/*
	 * Only the plan list gets its own scrollbar.
	 */
	.results-panel {
		position: sticky;
		top: 0;
		height: calc(100vh - 0px);
		min-width: 0;
		overflow-y: auto;
		overflow-x: hidden;
		border-right: 1px solid var(--border);
	}


	/*
	 * Details are part of the normal document/page flow.
	 * Long metadata therefore makes the whole page scroll.
	 */
	.details-panel {
		min-width: 0;
		overflow: visible;
	}

    .results-header {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
    }

    .category {
        border-bottom: 1px solid #272b34;

        /* Let the browser skip rendering off-screen categories */
        content-visibility: auto;
        contain-intrinsic-size: 500px;
    }

    .category-name {
        padding: 9px 16px 7px;
        background: var(--panel-2);
        color: #dce2ec;
        font-size: 13px;
        font-weight: 700;
    }

    .plan-list {
        padding: 3px 0;
    }

	/* ============================
	   Plan list rows
	   ============================ */

	.plan-item-row {
		position: relative;
	}

	.plan-item-row .plan-item {
		display: block;
		width: 100%;
		padding: 8px 16px 8px 29px;
		border: 0;
		border-radius: 0;
		background: transparent;
		color: var(--text);
		text-align: left;
		transition: background 0.1s;
	}

	.plan-item-row.has-cart .plan-item {
		padding-right: 48px;
	}

	.plan-item-row .plan-item:hover {
		background: #222733;
	}

	.plan-item-row .plan-item.selected {
		background: var(--selected);
	}

	.cart-add-button {
		position: absolute;
		right: 10px;
		top: 50%;
		transform: translateY(-50%);

		width: 28px;
		height: 28px;
		padding: 0;

		display: flex;
		align-items: center;
		justify-content: center;

		border-radius: 6px;
		background: var(--panel-2);
		border: 1px solid var(--border);
		color: var(--text);

		font-size: 16px;
		line-height: 1;

		cursor: pointer;
		opacity: 0.75;
	}

	.cart-add-button:hover {
		opacity: 1;
		background: var(--selected);
	}

	.cart-add-button.in-cart {
		opacity: 1;
		background: var(--accent);
		border-color: var(--accent);
		color: #0b1220;
		font-weight: 700;
	}


	.character-icon {
		flex: 0 0 auto;
		width: 20px;
		height: 20px;
		object-fit: contain;
	}



    .plan-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
    }

    .plan-guid {
        margin-top: 2px;
        color: var(--muted);
        font-family: monospace;
        font-size: 11px;
    }

    .empty {
        padding: 30px 20px;
        color: var(--muted);
        text-align: center;
    }


	.details {
		max-width: 1000px;
		margin: 0 auto;
		padding: 28px;
	}

    .details-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 300px;
        color: var(--muted);
    }

    .plan-heading {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        margin-bottom: 28px;
    }

    .icon-container {
        flex: 0 0 160px;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0d0f13;
    }

    .icon-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: auto;
    }

    .heading-text {
        min-width: 0;
    }

    .heading-text h2 {
        margin: 0 0 8px;
        font-size: 25px;
        overflow-wrap: anywhere;
    }

    .heading-category {
        color: var(--muted);
        font-size: 14px;
    }

	.heading-actions {
		margin-top: 14px;
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
	}

    .description {
        margin: 0 0 28px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .metadata {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }

    .metadata-row {
        display: contents;
    }

    .metadata-key,
    .metadata-value {
        padding: 11px 13px;
        border-bottom: 1px solid var(--border);
    }

    .metadata-row:last-child .metadata-key,
    .metadata-row:last-child .metadata-value {
        border-bottom: 0;
    }

    .metadata-key {
        background: var(--panel-2);
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
    }

    .metadata-value {
        min-width: 0;
        background: var(--panel);
        overflow-wrap: anywhere;
        font-family: monospace;
        font-size: 13px;
    }

    .loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 11, 14, 0.92);
    }

    .loading-box {
        width: min(500px, calc(100vw - 40px));
        padding: 25px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        text-align: center;
    }

    .loading-text {
        color: var(--muted);
        margin-top: 8px;
        font-size: 13px;
    }

    .error {
        margin: 20px;
        padding: 15px;
        border: 1px solid #713838;
        border-radius: 8px;
        background: #261719;
        color: #ffb5b5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

@media (max-width: 800px) {
    main {
        display: flex;
        flex-direction: column;
    }

    /*
     * Metadata/details comes FIRST on mobile.
     */
    .details-panel {
        order: 1;
        width: 100%;
        min-height: 0;
        overflow: visible;
    }

    /*
     * Plans browser comes BELOW the metadata.
     */
    .results-panel {
        order: 2;

        position: relative;
        top: auto;

        width: 100%;
        height: 45vh;
        max-height: 45vh;

        overflow-y: auto;
        overflow-x: hidden;

        border-right: 0;
        border-bottom: 1px solid var(--border);
        border-top: 1px solid var(--border);
    }

    .details {
        width: 100%;
        max-width: none;
        padding: 20px;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .toolbar-group {
        width: 100%;
    }

    .toolbar-group select,
    .toolbar-group input {
        flex: 1;
        width: 100%;
        min-width: 0;
    }

    #search {
        width: 100%;
        min-width: 0;
    }

    .plan-heading {
        flex-direction: column;
    }

    .icon-container {
        width: 140px;
        height: 140px;
    }
}
.metadata-value-with-button {
    display: flex;
    align-items: center;
    gap: 8px;
}

.metadata-value-with-button .metadata-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

.metadata-value-with-character {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
}

.metadata-character-icon {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    object-fit: contain;
}

.copy-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex: 0 0 auto;
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--input);
    color: var(--text);
    font-size: 12px;
}

.copy-icon {
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
}

.copy-button:hover {
    background: var(--panel-2);
}

.copy-button.copied {
    border-color: #4caf50;
}

/* ============================
   Modal / cart / checkout
   ============================ */

.modal-backdrop {
	position: fixed;
	inset: 0;
	z-index: 200;

	display: flex;
	align-items: center;
	justify-content: center;

	padding: 20px;
	background: rgba(10, 11, 14, 0.82);
}

.modal {
	width: min(580px, 100%);
	max-height: calc(100vh - 40px);

	display: flex;
	flex-direction: column;

	background: var(--panel);
	border: 1px solid var(--border);
	border-radius: 10px;

	box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
	overflow: hidden;
}

.modal-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;

	padding: 16px 20px;
	border-bottom: 1px solid var(--border);
	background: var(--panel-2);
}

.modal-title {
	margin: 0;
	font-size: 18px;
}

.modal-close {
	width: 32px;
	height: 32px;
	padding: 0;

	display: flex;
	align-items: center;
	justify-content: center;

	background: transparent;
	border: 1px solid var(--border);
	border-radius: 6px;
	color: var(--muted);

	font-size: 20px;
	line-height: 1;
	cursor: pointer;
}

.modal-close:hover {
	color: var(--text);
	background: var(--panel);
}

.modal-body {
	flex: 1 1 auto;
	min-height: 0;
	overflow-y: auto;
	padding: 16px 20px;
}

.modal-footer {
	display: flex;
	flex-wrap: wrap;
	justify-content: flex-end;
	gap: 10px;

	padding: 14px 20px;
	border-top: 1px solid var(--border);
	background: var(--panel-2);
}

.cart-list {
	display: flex;
	flex-direction: column;
	gap: 8px;
}

.cart-list-scroll {
	max-height: 42vh;
	overflow-y: auto;
	padding-right: 4px;
}

.cart-entry {
	display: flex;
	align-items: center;
	gap: 12px;

	padding: 9px 11px;

	background: var(--panel-2);
	border: 1px solid var(--border);
	border-radius: 8px;
}

.cart-entry-icon {
	flex: 0 0 auto;

	width: 42px;
	height: 42px;

	object-fit: contain;

	border: 1px solid var(--border);
	border-radius: 6px;
	background: #0d0f13;
}

.cart-entry-name {
	flex: 1;
	min-width: 0;

	font-size: 14px;
	overflow-wrap: anywhere;
}

.cart-entry-remove {
	flex: 0 0 auto;

	width: 28px;
	height: 28px;
	padding: 0;

	display: flex;
	align-items: center;
	justify-content: center;

	background: transparent;
	border: 1px solid var(--border);
	border-radius: 6px;
	color: var(--muted);

	font-size: 16px;
	line-height: 1;
	cursor: pointer;
}

.cart-entry-remove:hover {
	color: var(--danger);
	border-color: var(--danger);
}

.cart-empty {
	padding: 32px 20px;
	text-align: center;
	color: var(--muted);
}

.guid-box {
	display: flex;
	align-items: stretch;
	gap: 8px;
	margin-top: 16px;
}

.guid-box textarea {
	flex: 1;
	min-width: 0;
	min-height: 88px;
	padding: 10px 12px;

	border: 1px solid var(--border);
	border-radius: 6px;
	background: var(--input);
	color: var(--text);

	font-family: monospace;
	font-size: 12px;

	resize: vertical;
	overflow-wrap: anywhere;
	white-space: pre-wrap;
	word-break: break-all;
}

.guid-box .copy-button {
	align-self: stretch;
	padding: 0 14px;
}

.cart-instructions {
	margin-top: 16px;
	padding: 14px 16px;

	border: 1px solid var(--border);
	border-radius: 8px;
	background: var(--panel-2);

	color: var(--muted);
	font-size: 13px;
	line-height: 1.65;

	white-space: pre-wrap;
	overflow-wrap: anywhere;
}

.cart-instructions a {
	color: var(--accent);
	overflow-wrap: anywhere;
}

.cart-instructions code {
	padding: 1px 5px;

	background: var(--input);
	border: 1px solid var(--border);
	border-radius: 4px;

	color: var(--text);
	font-size: 12px;
	font-family: monospace;
}

.primary-button {
	padding: 9px 16px;
	font-weight: 600;

	background: var(--accent);
	border-color: var(--accent);
	color: #0b1220;
}

.primary-button:hover {
	background: var(--accent-hover);
	border-color: var(--accent-hover);
}

.secondary-button {
	padding: 9px 16px;
}

@media (max-width: 800px) {
	.modal-footer {
		flex-direction: column-reverse;
		align-items: stretch;
	}

	.modal-footer button {
		width: 100%;
	}
}
</style>


</head>

<body>
<div class="app">


<header>
	<div class="header-row">
		<div class="header-info">
			<h1>LittleBigPlanet Plan Browser (frontend entirely by chatgpt)</h1>
			<div class="status" id="status">Loading...</div>
		</div>

		<button
			id="cartButton"
			class="cart-button"
			type="button"
			title="Cart"
			style="display:none;"
		>
			<svg
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<circle cx="9" cy="21" r="1"></circle>
				<circle cx="20" cy="21" r="1"></circle>
				<path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
			</svg>

			<span class="cart-count hidden" id="cartCount">0</span>
		</button>
	</div>
</header>

<div class="toolbar">


<div class="toolbar-group">
    <label for="characterSelect">Character</label>
    <select id="characterSelect">
        <option value="">All characters</option>
        <option value="Not toggle, oddsock nor swoop">Not toggle, oddsock nor swoop</option>
        <option value="Big Toggle">Big Toggle</option>
        <option value="Small Toggle">Small Toggle</option>
        <option value="Swoop">Swoop</option>
        <option value="Oddsock">Oddsock</option>
    </select>
</div>




    <div class="toolbar-group">
        <label for="gameSelect">Game</label>
        <select id="gameSelect"></select>
    </div>

    <div class="toolbar-group">
        <label for="languageSelect">Language</label>
        <select id="languageSelect"></select>
    </div>

<div class="toolbar-group">
    <label for="groupBySelect">Group by</label>
    <select id="groupBySelect">
        <option value="category">Categories</option>
        <option value="theme">Themes</option>
    </select>
</div>

<div class="toolbar-group group-filter-group">
    <label id="groupFilterLabel" for="groupFilterSearch">
        Category
    </label>

    <div class="searchable-select" id="groupFilterContainer">
        <input
            id="groupFilterSearch"
            type="search"
            placeholder="All categories"
            autocomplete="off"
            spellcheck="false"
        >

        <div
            id="groupFilterDropdown"
            class="searchable-dropdown"
        ></div>
    </div>
</div>

    <div class="toolbar-group" style="flex: 1;">
        <input
            id="search"
            type="search"
            placeholder="Search title or description..."
            autocomplete="off"
            spellcheck="false"
        >
    </div>


<label class="checkbox">
    <input id="searchTitle" type="checkbox" checked>
    Title
</label>

<label class="checkbox">
    <input id="searchDescription" type="checkbox" checked>
    Description
</label>

<label class="checkbox">
    <input id="caseSensitive" type="checkbox">
    Case sensitive
</label>

<label class="checkbox">
    <input id="hideMissingTextureGuids" type="checkbox">
    Hide missing icon GUIDs
</label>

</div>

<main>

    <section class="results-panel">
        <div class="results-header" id="resultsHeader">
            0 plans
        </div>

        <div id="results">
            <div class="empty">
                Loading plans...
            </div>
        </div>
    </section>

    <section class="details-panel">
        <div id="details">
            <div class="details-placeholder">
                Select a plan to view its details.
            </div>
        </div>
    </section>

</main>


</div>

</div>

<!--
    sql.js is the SQLite implementation used entirely in the browser.

    The database itself is never uploaded anywhere.
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>

<script>
"use strict";

/*
 * ============================================================
 * Configuration
 * ============================================================
 */

const PATHS = {
    gamesList: "games_list.json",
    gamesRoot: "lbppb_games",
    assetsRoot: "lbppb_assets"
};

/*
 * These are the fallback language keys specified in the question.
 */
const DEFAULT_TITLE_KEY = "810378753";
const DEFAULT_CATEGORY_KEY = "3309406048";
const DEFAULT_THEME_KEY = "1647223365";


const CHARACTER_MASK = 0x03E00000;

const CHARACTER_MASK_SMALL_TOGGLE = 0x00400000;
const CHARACTER_MASK_BIG_TOGGLE = 0x00200000;
const CHARACTER_MASK_SWOOP = 0x00600000;
const CHARACTER_MASK_ODDSOCK = 0x00800000;



/*
 * sql.js WASM location.
 */
const SQL_WASM_PATH =
    "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/";


/*
 * Files that, if present in a game directory, enable the "cart"
 * feature for that game.
 */
const CART_SUPPORT_FILES = [
    "support_fake_guid_comma_cart.txt",
    "support_fake_guid_comma_cart"
];

/*
 * localStorage key used to persist carts across page reloads.
 */
const CART_STORAGE_KEY = "lbppb_cart_v1";


/*
 * ============================================================
 * Application state
 * ============================================================
 */

const state = {
    sql: null,
    gameId: null,
    gameName: null,

    db: null,

    languages: [],
    language: null,
    translations: {},

    /*
     * All plans loaded from SQLite and augmented with translated
     * strings.
     */
    plans: [],

    /*
     * Map:
     *   texture GUID -> [sha1, url_starter]
     *
     * Loaded lazily the first time an icon needs to be resolved
     * or the user toggles "Hide missing icon GUIDs".
     */
    textureGuids: null,

    /*
     * Reverse map sha1 -> [guids]. Built lazily on first hash
     * search.
     */
    textureHashToGuids: null,

    selectedGuid: null,

    /*
     * Used to prevent stale async icon requests from changing
     * the currently displayed plan.
     */
    detailsRequestId: 0,

	groupFilterValue: "",

	/*
	 * Whether the current game supports the cart feature.
	 */
	cartSupported: false,

	/*
	 * Map of gameId -> array of plan GUID strings.
	 */
	cart: {},

	/*
	 * Currently displayed modal view: "cart" | "checkout" | null
	 */
	cartView: null
};

/*
 * Promise used to dedupe simultaneous requests for
 * texture_guids.json.
 */
let textureGuidsPromise = null;


/*
 * ============================================================
 * DOM helpers
 * ============================================================
 */

const $ = id => document.getElementById(id);

const gameSelect = $("gameSelect");

const characterSelect = $("characterSelect");
const languageSelect = $("languageSelect");
const groupBySelect = $("groupBySelect");
const groupFilterLabel = $("groupFilterLabel");
const groupFilterSearch = $("groupFilterSearch");
const groupFilterContainer = $("groupFilterContainer");
const groupFilterDropdown = $("groupFilterDropdown");
const searchInput = $("search");

const searchTitleInput = $("searchTitle");
const searchDescriptionInput = $("searchDescription");
const caseSensitiveInput = $("caseSensitive");
const hideMissingTextureGuidsInput = $("hideMissingTextureGuids");

const resultsElement = $("results");
const resultsHeader = $("resultsHeader");
const detailsElement = $("details");
const statusElement = $("status");

const loadingElement = $("loading");
const loadingTitle = $("loadingTitle");
const loadingText = $("loadingText");

const cartButton = $("cartButton");
const cartCountElement = $("cartCount");

const cartModal = $("cartModal");
const cartModalTitle = $("cartModalTitle");
const cartModalBody = $("cartModalBody");
const cartModalFooter = $("cartModalFooter");
const cartModalClose = $("cartModalClose");


const CHARACTER_ICONS = {
    "Big Toggle": "big_toggle_small_icon.png",
    "Small Toggle": "small_toggle_small_icon.png",
    "Swoop": "swoop_small_icon.png",
    "Oddsock": "oddsock_small_icon.png"
};


/*
 * ============================================================
 * Utility functions
 * ============================================================
 */

const collator = new Intl.Collator(undefined, {
    sensitivity: "base",
    numeric: true
});

function compareStrings(a, b) {
    return collator.compare(String(a), String(b));
}

function hasTextureGuidMapping(plan) {
    if (
        plan.iconGuid === null ||
        plan.iconGuid === undefined ||
        plan.iconGuid === ""
    ) {
        return false;
    }

    /*
     * If texture_guids.json hasn't been loaded yet, we can't
     * know. Treat as missing so we don't show unverified rows
     * in "Hide missing" mode until the map is ready.
     */
    if (!state.textureGuids) {
        return false;
    }

    return Object.prototype.hasOwnProperty.call(
        state.textureGuids,
        String(plan.iconGuid)
    );
}


function updateGroupFilter() {
    const groupBy = groupBySelect.value;

    /*
     * Reset the currently selected filter when changing
     * between categories and themes.
     */
    state.groupFilterValue = "";

    if (groupBy === "theme") {
        groupFilterLabel.textContent = "Theme";
        groupFilterSearch.placeholder = "All themes";
    } else {
        groupFilterLabel.textContent = "Category";
        groupFilterSearch.placeholder = "All categories";
    }

    groupFilterSearch.value = "";

    renderGroupFilterOptions();
}

function getGroupFilterValues() {
    const groupBy = groupBySelect.value;

    const values = groupBy === "theme"
        ? state.plans.map(plan => plan.theme)
        : state.plans.map(plan => plan.category);

    return [
        ...new Set(
            values.filter(
                value =>
                    value !== null &&
                    value !== undefined &&
                    String(value).trim() !== ""
            )
        )
    ].sort(compareStrings);
}

function renderGroupFilterOptions() {
    const groupBy = groupBySelect.value;

    const search = groupFilterSearch.value
        .trim()
        .toLocaleLowerCase();

    const values = getGroupFilterValues();

    const filteredValues = search === ""
        ? values
        : values.filter(value =>
            String(value)
                .toLocaleLowerCase()
                .includes(search)
        );

    groupFilterDropdown.innerHTML = "";

    /*
     * "All categories" / "All themes"
     */
    const allOption =
        document.createElement("button");

    allOption.type = "button";
    allOption.className =
        "searchable-option all-option";

    allOption.textContent =
        groupBy === "theme"
            ? "All themes"
            : "All categories";

	allOption.addEventListener(
		"click",
		() => {
			state.groupFilterValue = "";
			groupFilterPreviousValue = "";

			groupFilterSearch.value = "";

			groupFilterDropdown.classList.remove(
				"open"
			);

			renderResults();
		}
	);

    groupFilterDropdown.appendChild(
        allOption
    );

    if (filteredValues.length === 0) {
        const noResults =
            document.createElement("div");

        noResults.className =
            "searchable-no-results";

        noResults.textContent =
            "No matches found.";

        groupFilterDropdown.appendChild(
            noResults
        );

        return;
    }

    for (const value of filteredValues) {
        const option =
            document.createElement("button");

        option.type = "button";
        option.className =
            "searchable-option";

        if (value === state.groupFilterValue) {
            option.classList.add("selected");
        }

        option.textContent = value;

		option.addEventListener(
			"click",
			() => {
				/*
				 * This is now a real selection, so update the
				 * saved value.
				 */
				state.groupFilterValue = value;
				groupFilterPreviousValue = value;

				groupFilterSearch.value = value;

				groupFilterDropdown.classList.remove(
					"open"
				);

				renderResults();
			}
		);

        groupFilterDropdown.appendChild(
            option
        );
    }
}

function getCharacterIcon(character) {
    const filename = CHARACTER_ICONS[character];

    if (!filename) {
        return null;
    }

    return `${PATHS.assetsRoot}/${pathPart(filename)}`;
}



function getCharacterFromSubType(subType) {
    if (subType === null || subType === undefined) {
        return "Not toggle, oddsock nor swoop";
    }

    const value = Number(subType);

    if (!Number.isFinite(value)) {
        return "Not toggle, oddsock nor swoop";
    }

    const character = value & CHARACTER_MASK;

    if (character === CHARACTER_MASK_BIG_TOGGLE) {
        return "Big Toggle";
    }

    if (character === CHARACTER_MASK_SMALL_TOGGLE) {
        return "Small Toggle";
    }

    if (character === CHARACTER_MASK_SWOOP) {
        return "Swoop";
    }

    if (character === CHARACTER_MASK_ODDSOCK) {
        return "Oddsock";
    }

    return "Not toggle, oddsock nor swoop";
}



function setLoading(title, text = "") {
    loadingElement.style.display = "flex";
    loadingTitle.textContent = title;
    loadingText.textContent = text;
}

function hideLoading() {
    loadingElement.style.display = "none";
}

function setStatus(text) {
    statusElement.textContent = text;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/*
 * Since the server is expected to provide these files, encode
 * individual path components rather than allowing a value from
 * JSON to alter the directory structure.
 */
function pathPart(value) {
    return encodeURIComponent(String(value));
}

function gamePath(gameId, file) {
    return `${PATHS.gamesRoot}/${pathPart(gameId)}/${file}`;
}

function planIconPath(filename) {
  const name = filename.replace(/\.[^.]+$/, '');
  const isSha1 = /^[a-f0-9]{40}$/i.test(name);

  return isSha1
    ? `${PATHS.assetsRoot}/plan_icons/${pathPart(filename)}`
    : `${PATHS.assetsRoot}/${pathPart(filename)}`;
}

function normalizeSearch(value) {
    return value.trim();
}

function isGuidSearch(value) {
    return /^g\d+$/.test(value);
}

function isHashSearch(value) {
    return /^[0-9a-fA-F]{40}$/.test(value);
}

function formatSize(value) {
    if (value === null || value === undefined || value === "") {
        return "";
    }

    const bytes = Number(value);

    if (!Number.isFinite(bytes)) {
        return String(value);
    }

    if (bytes < 1024) {
        return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(2)} KiB`;
    }

    if (bytes < 1024 * 1024 * 1024) {
        return `${(bytes / (1024 * 1024)).toFixed(2)} MiB`;
    }

    return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GiB`;
}


/*
 * ============================================================
 * JSON / binary loading
 *
 * All fetches rely on the browser cache (no `cache: "no-store"`).
 * ============================================================
 */

async function fetchJson(url) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `Failed to load ${url}: HTTP ${response.status}`
        );
    }

    return response.json();
}

async function fetchText(url) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `Failed to load ${url}: HTTP ${response.status}`
        );
    }

    return response.text();
}

async function fetchArrayBuffer(url) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `Failed to load ${url}: HTTP ${response.status}`
        );
    }

    return response.arrayBuffer();
}

/*
 * Returns true if any of the CART_SUPPORT_FILES exist in the
 * given game directory. Files are probed in parallel.
 */
async function checkCartSupport(gameId) {
    const results = await Promise.all(
        CART_SUPPORT_FILES.map(async filename => {
            try {
                const response = await fetch(
                    gamePath(gameId, filename)
                );

                return response.ok;
            } catch (error) {
                return false;
            }
        })
    );

    return results.some(Boolean);
}


/*
 * ============================================================
 * Initial game loading
 * ============================================================
 */


async function loadGamesList() {
    const games = await fetchJson(PATHS.gamesList);

    if (!Array.isArray(games)) {
        throw new Error("games_list.json must contain an array.");
    }

    /*
     * Load all game names in parallel.
     */
    const names = await Promise.all(
        games.map(async gameId => {
            try {
                return (
                    await fetchText(
                        gamePath(gameId, "game_name.txt")
                    )
                ).trim();
            } catch (error) {
                console.warn(
                    `Could not load game_name.txt for ${gameId}:`,
                    error
                );

                return gameId;
            }
        })
    );

    gameSelect.innerHTML = "";

    games.forEach((gameId, index) => {
        const option = document.createElement("option");

        option.value = gameId;
        option.textContent = names[index];

        gameSelect.appendChild(option);
    });

    if (games.length === 0) {
        throw new Error("games_list.json contains no games.");
    }

    return games;
}



async function loadGame(gameId) {
    state.gameId = gameId;

    /*
     * Reset lazy texture state per game.
     */
    state.textureGuids = null;
    state.textureHashToGuids = null;
    textureGuidsPromise = null;

    setLoading(
        "Loading game...",
        gameId
    );

    /*
     * game_name.txt
     */
    const gameName = await fetchText(
        gamePath(gameId, "game_name.txt")
    );

    state.gameName = gameName.trim();

    /*
     * languages_list.json
     */
    const languages = await fetchJson(
        gamePath(gameId, "languages_list.json")
    );

    if (!Array.isArray(languages)) {
        throw new Error(
            `${gameId}/languages_list.json must contain an array.`
        );
    }

    state.languages = languages;

    languageSelect.innerHTML = "";

    for (const languageFile of languages) {
        const option = document.createElement("option");

        option.value = languageFile;

        /*
         * "english.json" -> "english"
         */
        option.textContent = languageFile.replace(
            /\.json$/i,
            ""
        );

        languageSelect.appendChild(option);
    }

    if (languages.length === 0) {
        throw new Error(
            `${gameId}/languages_list.json contains no languages.`
        );
    }

    /*
     * Default to the first language.
     */
    state.language = languages[0];

    languageSelect.value = state.language;

    /*
     * Make sure there is an array for this game.
     */
    if (!Array.isArray(state.cart[gameId])) {
        state.cart[gameId] = [];
    }

    /*
     * Fire cart-support probe, DB load, and translations load in
     * parallel.
     */
    setLoading(
        "Loading game data...",
        gameId
    );

    const [
        cartSupported
    ] = await Promise.all([
        checkCartSupport(gameId),
        loadGameDatabase(),
        loadTranslations()
    ]);

    state.cartSupported = cartSupported;

    await preparePlans();

    updateGroupFilter();
    renderResults();

    /*
     * Refresh header cart button visibility and count.
     */
    updateCartUI();

    /*
     * Close any open cart modal when switching games.
     */
    closeCartModal();

    setStatus(
        `${state.gameName} — ${state.plans.length.toLocaleString()} plans`
    );

    hideLoading();

    /*
     * Kick off texture_guids.json in the background so that
     * icon resolution and "hide missing" are ready by the time
     * the user interacts with them.
     */
    ensureTextureGuids().catch(error => {
        console.warn("Could not load texture_guids.json:", error);
    });
}


/*
 * ============================================================
 * SQLite
 * ============================================================
 */

async function loadGameDatabase() {
    const dbBuffer = await fetchArrayBuffer(
        gamePath(state.gameId, "plan_details.db")
    );

    state.db = new state.sql.Database(
        new Uint8Array(dbBuffer)
    );
}


/*
 * ============================================================
 * Translation loading
 * ============================================================
 */

async function loadTranslations() {
    const languageFile = state.language;

    const translations = await fetchJson(
        gamePath(
            state.gameId,
            `languages/${pathPart(languageFile)}`
        )
    );

    if (
        translations === null ||
        typeof translations !== "object" ||
        Array.isArray(translations)
    ) {
        throw new Error(
            `${state.gameId}/languages/${languageFile} must contain a JSON object.`
        );
    }

    state.translations = translations;
}


/*
 * ============================================================
 * Texture GUID loading
 *
 * This is heavy, so it is deferred until it is actually needed.
 * ============================================================
 */

async function loadTextureGuids() {
    const textureGuids = await fetchJson(
        gamePath(
            state.gameId,
            "texture_guids.json"
        )
    );

    if (
        textureGuids === null ||
        typeof textureGuids !== "object" ||
        Array.isArray(textureGuids)
    ) {
        throw new Error(
            `${state.gameId}/texture_guids.json must contain an object.`
        );
    }

    state.textureGuids = textureGuids;

    /*
     * Invalidate any previously built reverse map.
     */
    state.textureHashToGuids = null;

    return textureGuids;
}

function ensureTextureGuids() {
    if (state.textureGuids) {
        return Promise.resolve(state.textureGuids);
    }

    if (!textureGuidsPromise) {
        textureGuidsPromise = loadTextureGuids().catch(error => {
            /*
             * Allow retry on failure.
             */
            textureGuidsPromise = null;
            throw error;
        });
    }

    return textureGuidsPromise;
}

function getTextureHashToGuids() {
    if (state.textureHashToGuids) {
        return state.textureHashToGuids;
    }

    if (!state.textureGuids) {
        return null;
    }

    const map = {};

    for (const [key, value] of Object.entries(state.textureGuids)) {
        if (!Array.isArray(value) || value.length === 0) {
            continue;
        }

        const hash = value[0];

        if (!hash) {
            continue;
        }

        (map[hash] ??= []).push(key);
    }

    state.textureHashToGuids = map;

    return map;
}


/*
 * ============================================================
 * Translation helpers
 * ============================================================
 */

/*
 * The JSON language object has number keys.
 *
 * SQLite values may come back as numbers or strings, so convert
 * the key to a string before looking it up.
 */
function translationForKey(key) {
    if (key === null || key === undefined || key === "") {
        return null;
    }

    const normalizedKey = String(key);

    if (
        Object.prototype.hasOwnProperty.call(
            state.translations,
            normalizedKey
        )
    ) {
        return String(
            state.translations[normalizedKey]
        );
    }

    return null;
}

function getTitle(titleKey) {
    if (titleKey === null || titleKey === undefined || titleKey === "") {
        return (
            translationForKey(DEFAULT_TITLE_KEY) ??
            "MISSING_TRANS_KEY"
        );
    }

    return (
        translationForKey(titleKey) ??
        "MISSING_TRANS_KEY"
    );
}


function getCategory(categoryKey) {
    if (categoryKey === null || categoryKey === undefined || categoryKey === "") {
        return (
            translationForKey(DEFAULT_CATEGORY_KEY) ??
            "MISSING_TRANS_KEY"
        );
    }

    return (
        translationForKey(categoryKey) ??
        "MISSING_TRANS_KEY"
    );
}

function getTheme(themeKey, categoryKey, popitType) {
    /*
     * A null/empty theme_key defaults to 1647223365.
     */
    if (
        themeKey === null ||
        themeKey === undefined ||
        themeKey === ""
    ) {
        return (
            `${getPlanCategory(categoryKey, popitType)} ${translationForKey(DEFAULT_THEME_KEY) ?? "MISSING_TRANS_KEY"}`
        );
    }

	if (!translationForKey(DEFAULT_THEME_KEY)) {
		return `${getPlanCategory(categoryKey, popitType)} (MISSING_TRANS_KEY)`
	}

    return (
        translationForKey(themeKey) ??
        "MISSING_TRANS_KEY"
    );
}

function getPlanCategory(categoryKey, popitType) {
    /*
     * Plans using the default category key can have their
     * category determined by popit_type instead.
     *
     * Example:
     *
     * category_key = 3309406048
     * popit_type   = HEAD
     *
     * => category = HEAD
     */
    if (
        (String(categoryKey) === DEFAULT_CATEGORY_KEY || !categoryKey) &&
        popitType !== null &&
        popitType !== undefined &&
        String(popitType).trim() !== ""
    ) {
        return `${String(popitType)} (${getCategory(DEFAULT_CATEGORY_KEY)})`
    }

    return `${getCategory(categoryKey)} (${String(popitType)})`;
}

function getDescription(descriptionKey) {
    if (
        descriptionKey === null ||
        descriptionKey === undefined ||
        descriptionKey === ""
    ) {
        return "";
    }

    return translationForKey(descriptionKey) ?? "MISSING_TRANS_KEY";
}


/*
 * ============================================================
 * Read plans from SQLite
 * ============================================================
 */

async function preparePlans() {
    setLoading(
        "Reading plans...",
        "Querying plan_details.db"
    );

    const result = state.db.exec(`
		SELECT
			guid,
			file_path,
			timestamp,
			size,
			hash,
			icon_guid,
			title_key,
			description_key,
			category_key,
			theme_key,
			creator,
			sub_type,
			popit_type
		FROM plans
    `);

    const rows = result.length
        ? result[0].values
        : [];

    state.plans = rows.map(row => {
		const [
			guid,
			filePath,
			timestamp,
			size,
			hash,
			iconGuid,
			titleKey,
			descriptionKey,
			categoryKey,
			themeKey,
			creator,
			sub_type,
			popitType
		] = row;

		const title = getTitle(titleKey);
		const description = getDescription(descriptionKey);
		const category = getPlanCategory(categoryKey, popitType);
		const theme = getTheme(themeKey, categoryKey, popitType);
		const character = getCharacterFromSubType(sub_type);

		return {
			guid,
			filePath,
			timestamp,
			size,
			hash,
			iconGuid,
			titleKey,
			descriptionKey,
			categoryKey,
			themeKey,
			creator,

			title,
			description,
			category,
			theme,

			character,

			sub_type,
			popitType,
		};
    });

    /*
     * Sort alphabetically by category and then title.
     */
    state.plans.sort((a, b) => {
        const categoryCompare = compareStrings(
            a.category,
            b.category
        );

        if (categoryCompare !== 0) {
            return categoryCompare;
        }

        return compareStrings(
            a.title,
            b.title
        );
    });
}


/*
 * ============================================================
 * Searching
 * ============================================================
 */


function getFilteredPlans() {
    const rawSearch = normalizeSearch(
        searchInput.value
    );

	const groupBy = groupBySelect.value;
	const groupFilter = state.groupFilterValue;
    const caseSensitive = caseSensitiveInput.checked;
    const searchTitle = searchTitleInput.checked;
    const searchDescription = searchDescriptionInput.checked;
	const character = characterSelect.value;
	const hideMissing = hideMissingTextureGuidsInput.checked;

    /*
     * Special searches (guid / hash) run before text search and
     * bypass the title/description toggles.
     */
    const guidSearch = isGuidSearch(rawSearch);
    const hashSearch = !guidSearch && isHashSearch(rawSearch);

    let needle = rawSearch;

    if (
        rawSearch !== "" &&
        !guidSearch &&
        !hashSearch &&
        !caseSensitive
    ) {
        needle = rawSearch.toLocaleLowerCase();
    }

    /*
     * The "hide missing" flag can only be honoured once
     * texture_guids.json is loaded. If it isn't ready yet, we
     * ignore the filter rather than showing an empty list.
     */
    const canHideMissing =
        hideMissing && state.textureGuids !== null;

    /*
     * Single-pass filter over all plans.
     */
    const filtered = state.plans.filter(plan => {
        if (canHideMissing && !hasTextureGuidMapping(plan)) {
            return false;
        }

        if (character !== "" && plan.character !== character) {
            return false;
        }

        if (groupFilter !== "") {
            if (groupBy === "theme") {
                if (plan.theme !== groupFilter) return false;
            } else {
                if (plan.category !== groupFilter) return false;
            }
        }

        if (rawSearch === "") {
            return true;
        }

        if (guidSearch) {
            /*
             * Guid search is handled later because it has
             * fallback logic (plan GUID first, then icon GUID).
             */
            return true;
        }

        if (hashSearch) {
            /*
             * Hash search also handled later.
             */
            return true;
        }

        if (!searchTitle && !searchDescription) {
            return false;
        }

        if (searchTitle) {
            const title = String(plan.title ?? "");

            const haystack = caseSensitive
                ? title
                : title.toLocaleLowerCase();

            if (haystack.includes(needle)) {
                return true;
            }
        }

        if (searchDescription) {
            const description = String(plan.description ?? "");

            const haystack = caseSensitive
                ? description
                : description.toLocaleLowerCase();

            if (haystack.includes(needle)) {
                return true;
            }
        }

        return false;
    });

    /*
     * Apply GUID / hash special search post-filtering because
     * they need to operate on the already-filtered set.
     */
    if (guidSearch) {
        const guid = rawSearch.substring(1);

        const byPlanGuid = filtered.filter(
            plan => String(plan.guid) === guid
        );

        if (byPlanGuid.length > 0) {
            return byPlanGuid;
        }

        return filtered.filter(
            plan => String(plan.iconGuid) === guid
        );
    }

    if (hashSearch) {
        const wantedHash = caseSensitive
            ? rawSearch
            : rawSearch.toLowerCase();

        const byPlanHash = filtered.filter(plan => {
            if (
                plan.hash === null ||
                plan.hash === undefined
            ) {
                return false;
            }

            const planHash = String(plan.hash);

            return caseSensitive
                ? planHash === wantedHash
                : planHash.toLowerCase() === wantedHash;
        });

        if (byPlanHash.length > 0) {
            return byPlanHash;
        }

        const map = getTextureHashToGuids();

        if (map) {
            const guids = map[wantedHash];

            if (guids && guids.length > 0) {
                const guidSet = new Set(guids);

                return filtered.filter(
                    plan => guidSet.has(String(plan.iconGuid))
                );
            }
        }

        return [];
    }

    return filtered;
}

            ) {

            }

            button.dataset.guid = String(plan.guid);


const characterIcon = getCharacterIcon(
    plan.character
);

button.innerHTML = `
    <div class="plan-title">
        <span class="plan-title-text">
            ${escapeHtml(plan.title)}
        </span>

        ${
            characterIcon
                ? `
                    <img
                        class="character-icon"
                        src="${escapeHtml(characterIcon)}"
                        alt="${escapeHtml(plan.character)}"

                    >
                `

        }

        g${escapeHtml(plan.guid)}
    </div>
`;



            button.addEventListener(
                "click",
                () => selectPlan(plan)
            );

            row.appendChild(button);

            if (state.cartSupported) {
                const cartAdd =
                    document.createElement("button");

                cartAdd.type = "button";
                cartAdd.className = "cart-add-button";

                cartAdd.dataset.guid = String(plan.guid);

                updateCartAddButton(
                    cartAdd,
                    plan.guid
                );

                cartAdd.addEventListener(
                    "click",
                    event => {
                        event.stopPropagation();

                        if (isInCart(plan.guid)) {
                            removeFromCart(plan.guid);
                        } else {
                            addToCart(plan);
                        }
                    }
                );

                row.appendChild(cartAdd);

    resultsElement.replaceChildren(fragment);

/*
 * Icon resolution:
 *
 * 1. No icon_guid:
 *      plan_has_no_icon.png
 *
 * 2. icon_guid exists but isn't present in texture_guids.json:
 *      missing_icon_guid_in_texture_guids_json.png
 *
 * 3. icon_guid maps to a SHA1:
 *      plan_icons/<sha1>.png
 *
 * 4. If that actual PNG doesn't exist:
 *      missing_texture.png
 */
function getRemoteIconUrl(plan) {
    if (
        plan.iconGuid === null ||
        plan.iconGuid === undefined ||
        plan.iconGuid === ""
    ) {
        return null;
    }

    if (!state.textureGuids) {
        return null;
    }

    const key = String(plan.iconGuid);

    if (
        !Object.prototype.hasOwnProperty.call(
            state.textureGuids,
            key
        )
    ) {
        return null;
    }

    const value = state.textureGuids[key];

    if (!Array.isArray(value)) {
        return null;
    }

    const [hash, url_starter] = value;

    if (
        hash === null ||
        hash === undefined ||
        String(hash).trim() === ""
    ) {
        return null;
    }

    return (
		(url_starter ?? "") +
        encodeURIComponent(String(hash)) +
        ".png"
    );
}

function getFallbackIcon() {
    return planIconPath(
        "missing_texture.png"
    );
}

function getMissingGuidIcon() {
    return planIconPath(
        "missing_icon_guid_in_texture_guids_json.png"
    );
}


/*
 * ============================================================
 * Cart state helpers
 * ============================================================
 */

function loadCartFromStorage() {
    try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);

        if (raw) {
            const parsed = JSON.parse(raw);

            if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
                state.cart = parsed;
            }
        }
    } catch (error) {
        console.warn("Could not load cart from storage:", error);
        state.cart = {};
    }
}

function saveCartToStorage() {
    try {
        localStorage.setItem(
            CART_STORAGE_KEY,
            JSON.stringify(state.cart)
        );
    } catch (error) {
        console.warn("Could not save cart to storage:", error);
    }
}

function getCartForGame(gameId = state.gameId) {
    if (!gameId) {
        return [];
    }

    if (!Array.isArray(state.cart[gameId])) {
        state.cart[gameId] = [];
    }

    return state.cart[gameId];
}

function isInCart(guid) {
    const target = String(guid);

    return getCartForGame().some(
        item => String(item) === target
    );
}

function addToCart(plan) {
    if (!state.cartSupported) {
        return;
    }

    const cart = getCartForGame();
    const target = String(plan.guid);

    if (cart.some(item => String(item) === target)) {
        return;
    }

    cart.push(target);

    saveCartToStorage();
    updateCartButtonForGuid(target);
}

function removeFromCart(guid) {
    const gameId = state.gameId;

    if (!gameId) {
        return;
    }

    const target = String(guid);

    state.cart[gameId] = getCartForGame(gameId).filter(
        item => String(item) !== target
    );

    saveCartToStorage();
    updateCartButtonForGuid(target);
}

function clearCart() {
    if (!state.gameId) {
        return;
    }

    state.cart[state.gameId] = [];

    saveCartToStorage();

    /*
     * Clear-all changes every button, so do a full refresh in
     * this case.
     */
    refreshCartButtons();
}

/*
 * Returns the plan objects currently in the cart, in cart order.
 */
function getCartPlans() {
    const guids = getCartForGame();

    return guids
        .map(guid =>
            state.plans.find(
                plan => String(plan.guid) === String(guid)
            )
        )
        .filter(Boolean);
}

function updateCartAddButton(button, guid) {
    if (isInCart(guid)) {
        button.classList.add("in-cart");
        button.textContent = "✓";
        button.title = "Remove from cart";
    } else {
        button.classList.remove("in-cart");
        button.textContent = "+";
        button.title = "Add to cart";
    }
}

function updateDetailsCartButton() {
    const button = $("detailsCartButton");

    if (!button) {
        return;
    }

    const guid = button.dataset.guid;

    if (isInCart(guid)) {
        button.textContent = "Remove from cart";
    } else {
        button.textContent = "Add to cart";
    }
}

/*
 * Updates only the list row matching the given guid, the
 * details button, and the header cart UI.
 */
function updateCartButtonForGuid(guid) {
    const target = String(guid);

    const row = document.querySelector(
        `.plan-item-row[data-guid="${CSS.escape(target)}"]`
    );

    if (row) {
        const button = row.querySelector(
            ".cart-add-button"
        );

        if (button) {
            updateCartAddButton(button, target);
        }
    }

    updateDetailsCartButton();
    updateCartUI();

    /*
     * If a cart/checkout modal is currently open, refresh it.
     */
    if (state.cartView === "cart") {
        renderCartModal();
    } else if (state.cartView === "checkout") {
        renderCheckoutModal();
    }
}

/*
 * Full refresh of every cart button. Used sparingly (clear cart,
 * cart support toggling on, etc.).
 */
function refreshCartButtons() {
    document
        .querySelectorAll(".plan-item-row")
        .forEach(row => {
            const button = row.querySelector(
                ".cart-add-button"
            );

            if (!button) {
                return;
            }

            updateCartAddButton(button, row.dataset.guid);
        });

    updateDetailsCartButton();
    updateCartUI();

    if (state.cartView === "cart") {
        renderCartModal();
    } else if (state.cartView === "checkout") {
        renderCheckoutModal();
    }
}

function updateCartUI() {
    if (!cartButton || !cartCountElement) {
        return;
    }

    if (!state.cartSupported) {
        cartButton.style.display = "none";
        return;
    }

    cartButton.style.display = "inline-flex";

    const count = getCartForGame().length;

    if (count === 0) {
        cartCountElement.classList.add("hidden");
    } else {
        cartCountElement.classList.remove("hidden");
        cartCountElement.textContent = String(count);
    }
}


/*
 * ============================================================
 * Cart modal
 * ============================================================
 */

function createCartEntryIcon(plan) {
    const img = document.createElement("img");

    img.className = "cart-entry-icon";
    img.alt = "";
    img.loading = "lazy";

    const remote = getRemoteIconUrl(plan);

    if (remote) {
        img.src = remote;

        img.onerror = () => {
            img.onerror = null;
            img.src = getFallbackIcon();
        };
    } else {
        img.src = getMissingGuidIcon();
    }

    return img;
}

function createCartEntry(plan, options = {}) {
    const {
        showRemove = true
    } = options;

    const entry = document.createElement("div");
    entry.className = "cart-entry";

    entry.appendChild(createCartEntryIcon(plan));

    const name = document.createElement("div");
    name.className = "cart-entry-name";
    name.textContent = plan.title;
    name.title = plan.title;

    entry.appendChild(name);

    if (showRemove) {
        const remove = document.createElement("button");

        remove.type = "button";
        remove.className = "cart-entry-remove";
        remove.textContent = "×";
        remove.title = "Remove from cart";

        remove.addEventListener("click", () => {
            removeFromCart(plan.guid);
        });

        entry.appendChild(remove);
    }

    return entry;
}

function openCartModal() {
    if (!state.cartSupported) {
        return;
    }

    renderCartModal();

    cartModal.style.display = "flex";
}

function closeCartModal() {
    cartModal.style.display = "none";
    state.cartView = null;
}

function renderCartModal() {
    state.cartView = "cart";

    cartModalTitle.textContent = "Cart";

    cartModalBody.innerHTML = "";
    cartModalFooter.innerHTML = "";

    const plans = getCartPlans();

    if (plans.length === 0) {
        const empty = document.createElement("div");

        empty.className = "cart-empty";
        empty.textContent = "Your cart is empty.";

        cartModalBody.appendChild(empty);

        return;
    }

    const list = document.createElement("div");
    list.className = "cart-list";

    for (const plan of plans) {
        list.appendChild(createCartEntry(plan));
    }

    cartModalBody.appendChild(list);

    /*
     * Footer: Clear cart + Continue to checkout
     */
    const clearButton = document.createElement("button");

    clearButton.type = "button";
    clearButton.className = "secondary-button";
    clearButton.textContent = "Clear cart";

    clearButton.addEventListener("click", () => {
        clearCart();
    });

    const checkoutButton = document.createElement("button");

    checkoutButton.type = "button";
    checkoutButton.className = "primary-button";
    checkoutButton.textContent = "Continue to checkout";

    checkoutButton.addEventListener("click", () => {
        renderCheckoutModal();
    });

    cartModalFooter.appendChild(clearButton);
    cartModalFooter.appendChild(checkoutButton);
}

function renderCheckoutModal() {
    state.cartView = "checkout";

    cartModalTitle.textContent = "Checkout";

    cartModalBody.innerHTML = "";
    cartModalFooter.innerHTML = "";

    const plans = getCartPlans();

    if (plans.length === 0) {
