/*
 * ============================================================
 * Plan details
 * ============================================================
 */

async function selectPlan(plan) {
    state.selectedGuid = plan.guid;

    /*
     * Update only the affected buttons rather than
     * re-rendering the entire list.
     */
    document
        .querySelectorAll(".plan-item.selected")
        .forEach(el => el.classList.remove("selected"));

    const newButton = document.querySelector(
        `.plan-item[data-guid="${CSS.escape(String(plan.guid))}"]`
    );

    if (newButton) {
        newButton.classList.add("selected");
    }

    const requestId = ++state.detailsRequestId;

    await renderDetails(plan, requestId);
}

async function renderDetails(plan, requestId) {
    /*
     * Ensure texture_guids.json is loaded so icon resolution
     * works. If loading fails we fall back to the missing
     * icons.
     */
    try {
        await ensureTextureGuids();
    } catch (error) {
        console.warn(
            "texture_guids.json could not be loaded:",
            error
        );
    }

    /*
     * The user may have selected another plan while we were
     * waiting for texture_guids.json.
     */
    if (requestId !== state.detailsRequestId) {
        return;
    }

    const remoteIconUrl = getRemoteIconUrl(plan);

    let initialIcon = null;

    if (!remoteIconUrl) {
        const hasTextureMapping =
            state.textureGuids !== null &&
            plan.iconGuid !== null &&
            plan.iconGuid !== undefined &&
            plan.iconGuid !== "" &&
            Object.prototype.hasOwnProperty.call(
                state.textureGuids,
                String(plan.iconGuid)
            );

        if (!hasTextureMapping) {
            initialIcon = getMissingGuidIcon();
        }
    }

    detailsElement.innerHTML = `
        <div class="details">

            <div class="plan-heading">

                <div class="icon-container">
                    <img
                        id="planIcon"
                        alt="Plan icon"
                        ${initialIcon
                            ? `src="${escapeHtml(initialIcon)}"`
                            : ""
                        }
                    >
                </div>

                <div class="heading-text">
                    <h2>${escapeHtml(plan.title)}</h2>

                    <div class="heading-category">
                        ${escapeHtml(plan.category)}
                    </div>

                    ${
                        state.cartSupported
                            ? `
                                <div class="heading-actions">
                                    <button
                                        id="detailsCartButton"
                                        class="secondary-button"
                                        type="button"
                                        data-guid="${escapeHtml(String(plan.guid))}"
                                    ></button>
                                </div>
                            `
                            : ""
                    }
                </div>

            </div>

            <div class="description">
                ${escapeHtml(plan.description)}
            </div>

            <div class="metadata">

                ${metadataRow("Title", plan.title)}
                ${metadataRow("Description", plan.description)}
                ${metadataRow("Category", plan.category)}
				${metadataRow("Theme", plan.theme)}
				${metadataRow("Popit Type", plan.popitType)}
                ${metadataRow("Creator", plan.creator)}
				${metadataRow("Character", plan.character, {
					characterIcon: getCharacterIcon(plan.character)
				})}
                ${metadataRow("File path", plan.filePath, { copy: true })}
                ${metadataRow("GUID", `g${plan.guid}`)}
                ${metadataRow("Hash", plan.hash)}
                ${metadataRow("Timestamp", formatTimestamp(plan.timestamp))}

                ${metadataRow(
                    "Size",
                    formatSize(plan.size) +
                    (
                        plan.size !== null &&
                        plan.size !== undefined &&
                        plan.size !== ""
                            ? ` (${plan.size} bytes)`
                            : ""
                    )
                )}

            </div>

        </div>
    `;

    /*
     * Wire up the details "Add to cart" / "Remove from cart" button.
     */
    const detailsCartButton = $("detailsCartButton");

    if (detailsCartButton) {
        detailsCartButton.addEventListener("click", () => {
            if (isInCart(plan.guid)) {
                removeFromCart(plan.guid);
            } else {
                addToCart(plan);
            }
        });

        updateDetailsCartButton();
    }

    detailsElement
        .querySelectorAll(".copy-button")
        .forEach(button => {
            button.addEventListener(
                "click",
                async () => {
                    const value =
                        button.dataset.copyValue ?? "";

                    const textElement =
                        button.querySelector(
                            ".copy-button-text"
                        );

                    try {
                        await navigator.clipboard.writeText(
                            value
                        );

                        textElement.textContent = "Copied";
                        button.classList.add("copied");

                        setTimeout(() => {
                            textElement.textContent = "Copy";
                            button.classList.remove("copied");
                        }, 1500);

                    } catch (error) {
                        console.error(
                            "Could not copy value:",
                            error
                        );

                        textElement.textContent = "Failed";

                        setTimeout(() => {
                            textElement.textContent = "Copy";
                        }, 1500);
                    }
                }
            );
        });

    /*
     * Load the icon directly via the img element. The browser
     * cache prevents double downloads, and we avoid the
     * previous fetch-then-assign double request.
     */
    const img = $("planIcon");

    if (!img) {
        return;
    }

    if (!remoteIconUrl) {
        return;
    }

    img.onerror = () => {
        img.onerror = null;
        img.src = getFallbackIcon();
    };

    img.src = remoteIconUrl;
}

function formatTimestamp(timestamp) {
    if (
        timestamp === null ||
        timestamp === undefined ||
        String(timestamp).trim() === ""
    ) {
        return "";
    }

    const original = String(timestamp);
    const date = new Date(original);

    if (Number.isNaN(date.getTime())) {
        return original;
    }

    const day = date.getDate();

    // Ordinal suffix: 1st, 2nd, 3rd, 4th, 11th, 12th, 13th, etc.
    let suffix = "th";

    if (day % 100 < 11 || day % 100 > 13) {
        switch (day % 10) {
            case 1:
                suffix = "st";
                break;
            case 2:
                suffix = "nd";
                break;
            case 3:
                suffix = "rd";
                break;
        }
    }

    const weekday = new Intl.DateTimeFormat(undefined, {
        weekday: "long"
    }).format(date);

    const month = new Intl.DateTimeFormat(undefined, {
        month: "long"
    }).format(date);

    const year = new Intl.DateTimeFormat(undefined, {
        year: "numeric"
    }).format(date);

    const formattedDate =
        `${weekday} ${day}${suffix} ${month} ${year}`;

    const timePart = new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    }).format(date);

    const formattedTime = timePart
        .replace(/\s?(AM|PM)$/i, match =>
            match.trim().toLowerCase()
        );

    return `${formattedDate} ${formattedTime} (${original})`;
}

function metadataRow(key, value, options = {}) {
    const {
        copy = false,
        copyValue = value,
        characterIcon = null
    } = options;

    const displayValue =
        value === null || value === undefined
            ? ""
            : String(value);

    const valueHtml = characterIcon
		? `
			<div class="metadata-value-with-character">
				<span class="metadata-text">
					${escapeHtml(displayValue)}
				</span>
				<img
					class="metadata-character-icon"
					src="${escapeHtml(characterIcon)}"
					alt="${escapeHtml(displayValue)}"
					title="${escapeHtml(displayValue)}"
					loading="lazy"
				>
			</div>
		`
        : copy
            ? `
                <div class="metadata-value-with-button">
                    <span class="metadata-text">
                        ${escapeHtml(displayValue)}
                    </span>

                    <button
                        class="copy-button"
                        type="button"
                        data-copy-value="${escapeHtml(
                            copyValue === null ||
                            copyValue === undefined
                                ? ""
                                : String(copyValue)
                        )}"
                    >
                        <svg
                            class="copy-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <rect
                                x="9"
                                y="9"
                                width="11"
                                height="11"
                                rx="2"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            />
                            <path
                                d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>

                        <span class="copy-button-text">Copy</span>
                    </button>
                </div>
            `
            : escapeHtml(displayValue);

    return `
        <div class="metadata-row">
            <div class="metadata-key">
                ${escapeHtml(key)}
            </div>

            <div class="metadata-value">
                ${valueHtml}
            </div>
        </div>
    `;
}


/*
 * ============================================================
 * Event handlers
 * ============================================================
 */

gameSelect.addEventListener(
    "change",
    async () => {
        try {
            state.selectedGuid = null;

            detailsElement.innerHTML = `
                <div class="details-placeholder">
                    Select a plan to view its details.
                </div>
            `;

            await loadGame(
                gameSelect.value
            );
        } catch (error) {
            showError(error);
        }
    }
);

let groupFilterPreviousValue = "";

groupFilterSearch.addEventListener(
    "focus",
    () => {
        /*
         * Remember what was selected before the user started
         * interacting with the dropdown.
         */
        groupFilterPreviousValue =
            state.groupFilterValue;

        /*
         * Clear the visible input so the user can type a new
         * search immediately.
         */
        groupFilterSearch.value = "";

        renderGroupFilterOptions();

        groupFilterDropdown.classList.add("open");
    }
);

groupFilterSearch.addEventListener(
    "input",
    () => {
        /*
         * Typing only filters the dropdown.
         * It does NOT change the actual selected filter.
         */
        renderGroupFilterOptions();

        groupFilterDropdown.classList.add("open");
    }
);

document.addEventListener(
    "click",
    event => {
        if (
            !groupFilterContainer.contains(
                event.target
            )
        ) {
            /*
             * The user clicked away without selecting
             * anything, so restore the previous selection.
             */
            state.groupFilterValue =
                groupFilterPreviousValue;

            groupFilterSearch.value =
                groupFilterPreviousValue;

            groupFilterDropdown.classList.remove(
                "open"
            );

            renderResults();
        }
    }
);

groupBySelect.addEventListener(
    "change",
    () => {
        /*
         * Change the filter from Category <-> Theme.
         */
        updateGroupFilter();

        /*
         * Re-render the plans using the new grouping.
         */
        renderResults();
    }
);

characterSelect.addEventListener(
    "change",
    () => {
        renderResults();
    }
);



languageSelect.addEventListener(
    "change",
    async () => {
        try {
            state.language =
                languageSelect.value;

            setLoading(
                "Changing language...",
                state.language
            );

            await loadTranslations();
            await preparePlans();

            updateGroupFilter();
            renderResults();

            /*
             * Refresh the selected plan if there is one.
             */
            if (state.selectedGuid !== null) {
                const selected =
                    state.plans.find(
                        plan =>
                            String(plan.guid) ===
                            String(state.selectedGuid)
                    );

                if (selected) {
                    await renderDetails(
                        selected,
                        ++state.detailsRequestId
                    );
                }
            }

            setStatus(
                `${state.gameName} — ` +
                `${state.plans.length.toLocaleString()} plans`
            );

            hideLoading();
        } catch (error) {
            showError(error);
        }
    }
);

/*
 * Search input is debounced so that each keystroke doesn't
 * trigger a full re-render.
 */
let searchDebounce = null;

searchInput.addEventListener(
    "input",
    () => {
        if (searchDebounce !== null) {
            clearTimeout(searchDebounce);
        }

        searchDebounce = setTimeout(() => {
            searchDebounce = null;
            renderResults();
        }, 150);
    }
);



caseSensitiveInput.addEventListener(
    "change",
    () => {
        renderResults();
    }
);

hideMissingTextureGuidsInput.addEventListener(
    "change",
    async () => {
        /*
         * "Hide missing" requires texture_guids.json.
         * Load it on demand the first time.
         */
        if (hideMissingTextureGuidsInput.checked) {
            try {
                setLoading(
                    "Loading texture information...",
                    "Reading texture_guids.json"
                );

                await ensureTextureGuids();

                hideLoading();
            } catch (error) {
                hideLoading();
                console.warn(
                    "Could not load texture_guids.json:",
                    error
                );
            }
        }

        renderResults();
    }
);

/*
 * Cart button + modal events.
 */
cartButton.addEventListener("click", () => {
    if (state.cartView === null) {
        openCartModal();
    } else {
        closeCartModal();
    }
});

cartModalClose.addEventListener("click", () => {
    closeCartModal();
});

/*
 * Clicking the backdrop closes the modal.
 */
cartModal.addEventListener("click", event => {
    if (event.target === cartModal) {
        closeCartModal();
    }
});

/*
 * Escape closes the modal.
 */
document.addEventListener("keydown", event => {
    if (
        event.key === "Escape" &&
        cartModal.style.display !== "none"
    ) {
        closeCartModal();
    }
});


/*
 * ============================================================
 * Error handling
 * ============================================================
 */

function showError(error) {
    console.error(error);

    loadingElement.style.display = "none";

    resultsElement.innerHTML = `
        <div class="error">
            ${escapeHtml(
                error instanceof Error
                    ? error.message
                    : String(error)
            )}
        </div>
    `;

    detailsElement.innerHTML = `
        <div class="error">
            An error occurred while loading the game data.
        </div>
    `;

    setStatus("Error");
}


/*
 * ============================================================
 * Startup
 * ============================================================
 */

async function start() {
    try {
        /*
         * Restore any previously saved carts.
         */
        loadCartFromStorage();

        setLoading(
            "Loading SQLite engine...",
            "Initializing sql.js"
        );

        state.sql = await initSqlJs({
            locateFile: file =>
                SQL_WASM_PATH + file
        });

        setLoading(
            "Loading game list...",
            PATHS.gamesList
        );

        const games = await loadGamesList();

        gameSelect.value = games[0];

        await loadGame(
            games[0]
        );

    } catch (error) {
        showError(error);
    }
}

start();

</script>
